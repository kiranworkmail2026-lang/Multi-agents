services:
  - type: web
    name: multi-agent-svc
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Ingest is performed lazily on container startup by server.py's lifespan
    # hook (covers fresh deploys AND silent restarts on ephemeral disk).
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Google AI Studio key — chat (gemma-4-31b-it) + embeddings (gemini-embedding-001).
      # Get one at https://aistudio.google.com/apikey
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemma-4-31b-it
      - key: EMBED_MODEL
        value: gemini-embedding-001
      # Web search.
      - key: SERPAPI_API_KEY
        sync: false
      # Shared secret between this service and the Go backend.
      - key: SERVICE_API_KEY
        generateValue: true
      # MongoDB connection for the LangGraph checkpointer (persists
      # interrupted runs so /resume works across container restarts).
      # If unset, the service falls back to an in-memory checkpointer
      # — fine for testing, NOT for production (state lost on restart).
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: multi_agents
